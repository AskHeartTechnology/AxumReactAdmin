[package]
name = "AxumReactAdmin"
version = "0.1.0"
edition = "2024"

[lib]
name = "ara"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
config = { version = "0.15.25", features = ["toml"] }
dotenv = "0.15.0"
rust-embed = "8.12.0"
mime_guess = "2"
